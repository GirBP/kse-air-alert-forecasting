[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kse-kyiv-alert-duration"
version = "1.0.0"
description = "Reproducible retrospective Kyiv alert-duration forecast with a fixed rolling median"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["kse_latest*"]
